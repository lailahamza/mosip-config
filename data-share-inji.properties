# Follow properites have their values assigned via 'overrides' environment variables of config server docker.
# DO NOT define these in any of the property files.  They must be passed as env variables.  Refer to config-server
# helm chart:
# keycloak.host
# mosip.mosip.datsha.client.secret
keycloak.host=https://iam.mosip.ma
mosipbox.public.url=https://inji.mosip.ma
mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
mosip.data.share.service.id=mosip.data.share
mosip.data.share.service.version=1.0

CRYPTOMANAGER_ENCRYPT=http://keymanager.kernel/v1/keymanager/encrypt
KEYMANAGER_JWTSIGN=http://keymanager.keymanager/v1/keymanager/jwtSign
PARTNER_POLICY=http://pms-policy.pms/v1/policymanager/policies/{policyId}/partner/{partnerId}
KEYBASEDTOKENAPI=http://authmanager.kernel/v1/authmanager/authenticate/clientidsecretkey

data.share.application.id=PARTNER
mosip.data.share.datetime.pattern=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
!-- if value is true then  please set servlet path to /   --!
mosip.data.share.urlshortner=false
data.share.token.request.appid=datsha
data.share.token.request.clientId=mosip-datsha-client
data.share.token.request.secretKey=WQQstkpgqGQiLwcQ
data.share.token.request.password=
data.share.token.request.username=
data.share.token.request.version=1.0
data.share.token.request.id=io.mosip.datashare
data.share.token.request.issuerUrl=${keycloak.host}/auth/realms/mosip
spring.servlet.multipart.max-file-size=4MB
mosip.data.share.protocol=http
mosip.data.share.includeCertificateHash=false
mosip.data.share.includeCertificate=false
mosip.data.share.includePayload=false
mosip.data.share.digest.algorithm=SHA256
mosip.data.share.prependThumbprint=false

# @TAB : for testing ---------
 
# Enables the data-share application in standalone mode.
mosip.data.share.standalone.mode.enabled=true
# Defines the policy json which will be taken into consideration if
# "mosip.data.share.standalone.mode.enabled" is set as true.
# If we are using "encryptionType" as "Partner based" then subscriberId must be a valid subscriberId
# i.e. should exist in system.
mosip.data.share.static-policy.policy-json={"typeOfShare":"","transactionsAllowed":"100","shareDomain":"datashare.datashare","encryptionType":"NONE","source":"","validForInMinutes":"100"}
# Defines the policyId which will be taken into consideration if "
# mosip.data.share.standalone.mode.enabled" is set as true.
mosip.data.share.static-policy.policy-id=static-policyid
# Defines the subscriberId which will be taken into consideration if
# "mosip.data.share.standalone.mode.enabled" is set as true.
mosip.data.share.static-policy.subscriber-id=static-subscriberid
# Disables JWT signature computation while storing object in object store.
mosip.data.share.signature.disabled=true
 
mosip.data.share.policy-cache.expiry-time-millisec=7200000
mosip.kernel.auth.appids.realm.map={prereg:'mosip',ida:'mosip',registrationclient:'mosip',regproc:'mosip',partner:'mosip',resident:'mosip',admin:'mosip',crereq:'mosip',creser:'mosip',datsha:'mosip',idrepo:'mosip'}

# OpenAPI Information
openapi.info.title=Data Share Service API documentation
openapi.info.description=Data Share service contains the APIs used by MOSIP Data Share module
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license

# Public URL Configuration
openapi.dataShareServiceServer.servers[0].url=${mosipbox.public.url}/v1/datashare
openapi.dataShareServiceServer.servers[0].description=Data Share service contains the APIs used by MOSIP Data Share module

# Legacy and Modern SpringDoc Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v1/datashare/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/v1/datashare/swagger-ui.html
springdoc.swagger-ui.url=/v1/datashare/v3/api-docs
springdoc.swagger-ui.config-url=/v1/datashare/v3/api-docs/swagger-config

# Server Servlet Configuration
server.servlet.path=/v1/datashare
spring.mvc.servlet.path=/v1/datashare

# Path Matching Configuration
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# OpenAPI Metadata
springdoc.packagesToScan=io.mosip.datashare
springdoc.pathsToMatch=/v1/datashare/**

# Legacy Swagger Configuration (for 1.5.x compatibility)
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.groups-url=/v1/datashare/swagger-config

# Additional Configurations
springdoc.show-actuator=true
springdoc.use-management-port=false

# MOSIP Security Ignore URLs
mosip.security.ignore-urls=/v1/datashare/swagger-ui/**,\
/v1/datashare/v3/api-docs/**,\
/v1/datashare/swagger-resources/**,\
/v1/datashare/webjars/**,\
/v1/datashare/swagger-ui.html,\
/v1/datashare/actuator/**

# Explicit OpenAPI Group Configuration
springdoc.group-configs[0].group=data-share
springdoc.group-configs[0].paths-to-match=/v1/datashare/**

# Compatibility Settings
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
